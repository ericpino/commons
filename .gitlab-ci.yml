stages:
  - lint
  - security
  - test
  - container

variables:
  POSTGRES_USER: commons
  POSTGRES_PASSWORD: ci_only
  POSTGRES_DB: commons
  DATABASE_URL: postgresql://commons:ci_only@postgres:5432/commons
  DEMO_PASSWORD: ci-demo-password
  DEMO_MODE: "true"
  WEB_ORIGIN: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: lint
  image: node:22
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint

semgrep:
  stage: security
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
  script:
    - semgrep scan --config auto --error

test:
  stage: test
  image: node:22
  needs:
    - lint
    - semgrep
  services:
    - name: postgres:16-alpine
      alias: postgres
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
    - |
      npm run test:migrations
      npm run start -w apps/api > /tmp/api.log 2>&1 &
      npm run test:integration
      npm run seed:demo
      node scripts/demo-readiness-integration.mjs

docker-build:
  stage: container
  image: docker:27
  needs:
    - test
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker compose -f docker-compose.yml config -q
    - docker build --target api -t commons-api:$CI_COMMIT_SHORT_SHA .
    - docker build --target web -t commons-web:$CI_COMMIT_SHORT_SHA .
