name: Continuous integration
on: [push, pull_request]
jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep scan
        run: semgrep scan --config auto --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, semgrep]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commons
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: commons
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          npm run test:migrations
          npm run start -w apps/api > /tmp/api.log 2>&1 &
          npm run test:integration
          npm run seed:demo
          node scripts/demo-readiness-integration.mjs
        env:
          DATABASE_URL: postgresql://commons:ci_only@localhost:5432/commons
          DEMO_PASSWORD: ci-demo-password
          DEMO_MODE: "true"
          WEB_ORIGIN: http://localhost:3000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
