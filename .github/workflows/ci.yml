name: Continuous integration
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commons
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: commons
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: |
          npm run start -w apps/api > /tmp/api.log 2>&1 &
          npm run test:integration
          npm run seed:demo
          node scripts/demo-readiness-integration.mjs
        env:
          DATABASE_URL: postgresql://commons:ci_only@localhost:5432/commons
          DEMO_PASSWORD: ci-demo-password
          DEMO_MODE: "true"
          WEB_ORIGIN: http://localhost:3000
