services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: commons
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - commons_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://commons:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/commons
      DEMO_PASSWORD: ${DEMO_PASSWORD:-local-demo-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_PORT: 4000
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        API_URL: ${INTERNAL_API_URL:-http://api:4000}
    restart: unless-stopped
    environment:
      API_URL: ${INTERNAL_API_URL:-http://api:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  commons_data:
